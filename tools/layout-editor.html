<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>底板布局编辑器</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:#f6f7f9;color:#20242b}
  header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #e3e6ea}
  h1{margin:0 8px 0 0;font-size:15px;font-weight:600}
  button{padding:5px 12px;border:1px solid #cfd4da;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
  button:hover{background:#eef1f5;border-color:#aab3bd}
  button.on{background:#20242b;border-color:#20242b;color:#fff}
  button.p{background:#2f7cf6;border-color:#2f7cf6;color:#fff}
  button.p:hover{background:#2168d8}
  .sep{width:1px;height:22px;background:#e3e6ea;margin:0 2px}
  .hint{color:#7b838d;font-size:12px;margin-left:auto}
  main{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  #stage{position:relative;width:1000px;height:640px;background:#fff;border:1px solid #d7dbe0;border-radius:8px;overflow:hidden;flex:none;touch-action:none}
  #bg{position:absolute;inset:0;width:1000px;height:640px;object-fit:contain;pointer-events:none;user-select:none}
  #cv{position:absolute;inset:0;width:1000px;height:640px;cursor:crosshair}
  #layer{position:absolute;inset:0;pointer-events:none}
  #layer.selmode{pointer-events:auto}
  #layer.selmode .sh{cursor:move}
  .sh{position:absolute;border:2px solid #2f7cf6;background:rgba(47,124,246,.06)}
  .sh.circle{border-radius:50%}
  .sh.sel{border-color:#f0722f;background:rgba(240,114,47,.10);box-shadow:0 0 0 1px #fff inset}
  .sh .lb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#2f7cf6;font-size:12px;white-space:nowrap;pointer-events:none}
  .sh .rz{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:#fff;border:2px solid #2f7cf6;border-radius:3px;cursor:nwse-resize}
  aside{flex:1;min-width:300px;display:flex;flex-direction:column;gap:8px}
  textarea{width:100%;height:280px;padding:10px;border:1px solid #cfd4da;border-radius:8px;font:12px/1.5 Consolas,monospace;resize:vertical;background:#fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tip{color:#7b838d;font-size:12px}
</style>
<header>
  <h1>底板布局编辑器</h1>
  <input id="file" type="file" accept="image/*" hidden>
  <button class="p" onclick="file.click()">① 上传参考图</button>
  <div class="sep"></div>
  <button id="mPen" class="on" onclick="mode('pen')">画笔（描轮廓）</button>
  <button id="mSel" onclick="mode('sel')">选择/移动</button>
  <div class="sep"></div>
  <button onclick="add('circle')">加圆</button>
  <button onclick="add('round')">加圆角方</button>
  <button onclick="add('rect')">加方</button>
  <button onclick="del()">删除选中</button>
  <div class="sep"></div>
  <button onclick="undo()">撤销 (Ctrl+Z)</button>
  <button onclick="clearAll()">全清</button>
  <button class="p" onclick="expo()">② 导出 JSON</button>
  <button onclick="png()">导出 PNG</button>
  <span class="hint">画笔：按住左键直接画；闭合轮廓请首尾画到一起</span>
</header>
<main>
  <div id="stage">
    <img id="bg" alt="">
    <canvas id="cv" width="1000" height="640"></canvas>
    <div id="layer"></div>
  </div>
  <aside>
    <div class="row"><b>导出结果</b><span class="tip">复制下面这段发我即可</span></div>
    <textarea id="out" spellcheck="false" placeholder="点「导出 JSON」后出现在这里"></textarea>
    <div class="tip">
      坐标系 1000 × 640（JSON 里就是这套数字）。<br>
      · 画笔描出来的轮廓导出为 <code>paths</code>（点列），我直接转成底板轮廓；<br>
      · 圆/方导出为 <code>shapes</code>，双击可命名（A、LB、左摇杆…）；<br>
      · 想画内圈/四瓣就用画笔再描一圈，或加小圆。
    </div>
  </aside>
</main>
<script>
const L = document.getElementById('layer'), BG = document.getElementById('bg'),
      CV = document.getElementById('cv'), X = CV.getContext('2d');
let shapes = [], paths = [], sel = null, uid = 1, drag = null, pen = null, hist = [], md = 'pen';

document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { BG.src = r.result; };
  r.readAsDataURL(f);
};

function mode(m) {
  md = m;
  document.getElementById('mPen').className = m === 'pen' ? 'on' : '';
  document.getElementById('mSel').className = m === 'sel' ? 'on' : '';
  L.className = m === 'sel' ? 'selmode' : '';
  CV.style.pointerEvents = m === 'pen' ? 'auto' : 'none';
}
function snap() { hist.push(JSON.stringify({ shapes, paths, uid })); if (hist.length > 60) hist.shift(); }
function undo() {
  if (!hist.length) return;
  const s = JSON.parse(hist.pop()); shapes = s.shapes; paths = s.paths; uid = s.uid; sel = null;
  render(); draw();
}
function add(t) {
  snap();
  const d = t === 'circle' ? 90 : t === 'round' ? 150 : 120;
  shapes.push({ id: uid++, t, x: 60 + (shapes.length % 6) * 40, y: 60 + (shapes.length % 6) * 30, w: d, h: t === 'rect' ? 90 : d, r: t === 'round' ? 14 : 0, name: '' });
  render(); pick(shapes[shapes.length - 1].id);
  if (md === 'pen') mode('sel');
}
function del() { if (sel == null) return; snap(); shapes = shapes.filter(s => s.id !== sel); sel = null; render(); }
function clearAll() { if (confirm('清空所有图形与轮廓？（图片保留）')) { snap(); shapes = []; paths = []; sel = null; render(); draw(); } }
function pick(id) { sel = id; render(); }

function render() {
  L.innerHTML = '';
  for (const s of shapes) {
    const el = document.createElement('div');
    el.className = 'sh ' + s.t + (s.id === sel ? ' sel' : '');
    el.style.cssText = `left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px` + (s.t === 'round' ? `;border-radius:${s.r}px` : '');
    el.dataset.id = s.id;
    if (s.name) { const t = document.createElement('div'); t.className = 'lb'; t.textContent = s.name; el.appendChild(t); }
    const h = document.createElement('div'); h.className = 'rz'; h.dataset.rz = s.id; el.appendChild(h);
    L.appendChild(el);
  }
}
function draw() {
  X.clearRect(0, 0, 1000, 640);
  X.lineJoin = X.lineCap = 'round'; X.strokeStyle = '#2f7cf6'; X.lineWidth = 2;
  for (const p of paths) {
    if (p.pts.length < 2) continue;
    X.beginPath(); X.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let i = 1; i < p.pts.length; i++) X.lineTo(p.pts[i][0], p.pts[i][1]);
    if (p.closed) X.closePath();
    X.stroke();
  }
}

CV.addEventListener('pointerdown', e => {
  if (md !== 'pen') return;
  const r = CV.getBoundingClientRect();
  pen = { pts: [[Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10]], closed: false };
  CV.setPointerCapture(e.pointerId);
});
CV.addEventListener('pointermove', e => {
  if (!pen) return;
  const r = CV.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) * 10) / 10, y = Math.round((e.clientY - r.top) * 10) / 10;
  const last = pen.pts[pen.pts.length - 1];
  if (Math.hypot(x - last[0], y - last[1]) < 2) return;      // 抽稀：小于 2px 的点丢弃
  pen.pts.push([x, y]);
  X.beginPath(); X.moveTo(last[0], last[1]); X.lineTo(x, y);
  X.lineJoin = X.lineCap = 'round'; X.strokeStyle = '#2f7cf6'; X.lineWidth = 2; X.stroke();
});
CV.addEventListener('pointerup', () => {
  if (!pen) return;
  if (pen.pts.length > 2) { snap(); paths.push(pen); draw(); }
  pen = null;
});

L.addEventListener('pointerdown', e => {
  if (md !== 'sel') return;
  const rz = e.target.dataset.rz, box = e.target.closest('.sh');
  if (!box) { sel = null; render(); return; }
  const s = shapes.find(v => v.id == box.dataset.id);
  pick(s.id);
  drag = { s, px: e.clientX, py: e.clientY, x: s.x, y: s.y, w: s.w, h: s.h, resize: !!rz };
  e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.px, dy = e.clientY - drag.py;
  if (drag.resize) { drag.s.w = Math.max(8, Math.round(drag.w + dx)); drag.s.h = Math.max(8, Math.round(drag.h + dy)); }
  else { drag.s.x = Math.round(drag.x + dx); drag.s.y = Math.round(drag.y + dy); }
  render();
});
document.addEventListener('pointerup', () => { drag = null; });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') { del(); e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); e.preventDefault(); }
  if (e.key === 'F2') name();
  if (e.key === 'p' || e.key === 'P') mode('pen');
  if (e.key === 'v' || e.key === 'V') mode('sel');
});
function name() {
  if (sel == null) return;
  const s = shapes.find(v => v.id === sel);
  const n = prompt('名字（如 A、LB、左摇杆）', s.name || '');
  if (n !== null) { s.name = n.trim(); render(); }
}
L.addEventListener('dblclick', e => { const b = e.target.closest('.sh'); if (b) { sel = +b.dataset.id; name(); } });

function stat() {
  return {
    canvas: { w: 1000, h: 640 },
    shapes: shapes.map(s => ({ t: s.t, x: s.x, y: s.y, w: s.w, h: s.h, r: s.r, name: s.name })),
    paths: paths.map(p => ({ closed: p.pts.length > 8 && Math.hypot(p.pts[0][0] - p.pts[p.pts.length - 1][0], p.pts[0][1] - p.pts[p.pts.length - 1][1]) < 14, pts: p.pts }))
  };
}
function expo() { document.getElementById('out').value = JSON.stringify(stat()); document.getElementById('out').select(); }

function png() {
  const s = stat(), c = document.createElement('canvas'); c.width = 1000; c.height = 640;
  const x = c.getContext('2d');
  x.fillStyle = '#1f2937'; x.fillRect(0, 0, 1000, 640);
  const done = () => {
    x.lineWidth = 2; x.strokeStyle = '#c8d2dc';
    for (const p of s.paths) {
      x.beginPath(); x.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let i = 1; i < p.pts.length; i++) x.lineTo(p.pts[i][0], p.pts[i][1]);
      if (p.closed) x.closePath();
      x.stroke();
    }
    for (const v of s.shapes) {
      x.beginPath();
      if (v.t === 'circle') x.arc(v.x + v.w / 2, v.y + v.h / 2, Math.min(v.w, v.h) / 2, 0, 7);
      else if (v.t === 'round') x.roundRect(v.x, v.y, v.w, v.h, v.r);
      else x.rect(v.x, v.y, v.w, v.h);
      x.stroke();
      if (v.name) { x.fillStyle = '#e8eef5'; x.font = '14px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(v.name, v.x + v.w / 2, v.y + v.h / 2); }
    }
    const a = document.createElement('a'); a.download = 'layout.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  if (BG.src) { const im = new Image(); im.onload = () => { x.drawImage(im, 0, 0, 1000, 640); done(); }; im.src = BG.src; } else done();
}
mode('pen');
</script>
</html>
